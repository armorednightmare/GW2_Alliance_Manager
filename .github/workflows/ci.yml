name: CI Build Check

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run TypeScript typecheck & Build
      run: npm run build
      env:
        NEXTAUTH_SECRET: "mock-secret-for-ci-build"
        NEXTAUTH_URL: "http://localhost:3000"
